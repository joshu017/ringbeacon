<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RingBeacon</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --accent-dim: #a83279;
    --text: #eee;
    --text-dim: #999;
    --border: #2a2a4a;
    --input-bg: #1a1a2e;
    --json-bg: #0d1117;
    --json-fg: #c9d1d9;
    --success: #3fb950;
    --warning: #d29922;
    --error: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Top Bar ─────────────────────────────────────────── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar h1 {
    font-size: 16px;
    font-weight: 600;
    margin-right: 12px;
    white-space: nowrap;
  }
  .repo-link {
    color: var(--text-dim);
    font-size: 13px;
    white-space: nowrap;
    text-underline-offset: 3px;
  }
  .repo-link:hover, .repo-link:focus-visible { color: var(--text); }
  .status {
    font-size: 13px;
    color: var(--text-dim);
    margin-left: auto;
    white-space: nowrap;
  }
  .status.connected { color: var(--success); }
  .status.error { color: var(--error); }
  .status.busy { color: var(--warning); }

  /* ── Buttons ─────────────────────────────────────────── */
  button, .btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: var(--accent-dim); border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:hover { background: var(--surface2); border-color: var(--border); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover { background: #d63a54; }

  /* ── Main Layout ─────────────────────────────────────── */
  .main {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* ── Sidebar ─────────────────────────────────────────── */
  .sidebar {
    width: 160px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 8px;
  }
  .sidebar h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    padding: 4px 8px 8px;
  }
  .cmd-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 2px;
  }
  .cmd-btn:hover { background: var(--surface2); }
  .cmd-btn.active {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  /* ── Content area (controls + JSON) ──────────────────── */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* ── Controls panel ──────────────────────────────────── */
  .controls {
    flex: 3;
    overflow-y: auto;
    padding: 16px;
    min-height: 200px;
  }
  .cmd-desc {
    font-style: italic;
    color: var(--text-dim);
    margin-bottom: 12px;
    font-size: 14px;
  }

  /* ── Sections ────────────────────────────────────────── */
  .section {
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }

  /* ── Form rows ───────────────────────────────────────── */
  .form-row {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
    gap: 8px;
  }
  .form-row label {
    width: 130px;
    flex-shrink: 0;
    font-size: 13px;
    color: var(--text-dim);
  }
  .form-row .hint {
    font-size: 12px;
    color: var(--text-dim);
    margin-left: 8px;
  }

  /* ── Inputs ──────────────────────────────────────────── */
  input[type="number"], input[type="text"], select {
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--input-bg);
    color: var(--text);
    font-size: 13px;
    width: 90px;
  }
  input[type="number"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  select { width: auto; min-width: 100px; }
  input[type="range"] { width: 140px; accent-color: var(--accent); }
  input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }

  /* ── Color input ─────────────────────────────────────── */
  .color-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .color-swatch {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: 2px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
  }
  .color-swatch:hover { border-color: var(--accent); }
  input[type="color"] { display: none; }
  .color-group input[type="number"] { width: 60px; }
  .color-group span { font-size: 12px; color: var(--text-dim); }
  .color2-hint {
    font-size: 12px;
    color: var(--text-dim);
    margin-left: 138px;
    margin-bottom: 8px;
  }

  /* ── Resize handle ───────────────────────────────────── */
  .resize-handle {
    height: 6px;
    background: var(--border);
    cursor: ns-resize;
    flex-shrink: 0;
    position: relative;
  }
  .resize-handle::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 40px;
    height: 2px;
    background: var(--text-dim);
    border-radius: 1px;
  }

  /* ── JSON Panel ──────────────────────────────────────── */
  .json-panel {
    flex: 1;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--border);
  }
  .json-header {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    gap: 8px;
    background: var(--surface);
    flex-shrink: 0;
  }
  .json-header span {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }
  .json-header .spacer { flex: 1; }
  #json-preview {
    flex: 1;
    margin: 0;
    padding: 12px 16px;
    background: var(--json-bg);
    color: var(--json-fg);
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.5;
    overflow: auto;
    white-space: pre;
    border: none;
    outline: none;
    resize: none;
  }

  /* ── Ring ID row ─────────────────────────────────────── */
  .id-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .id-row label { font-size: 13px; color: var(--text-dim); }
  .id-row input[type="text"] { width: 160px; }
</style>
</head>
<body>

<!-- ── Top Bar ──────────────────────────────────────────────────────────────── -->
<div class="topbar">
  <h1>RingBeacon</h1>
  <a class="repo-link" href="https://github.com/joshu017/ringbeacon" target="_blank" rel="noopener noreferrer" aria-label="RingBeacon source on GitHub (opens in a new tab)">GitHub</a>
  <button id="btn-scan" onclick="bleConnect()">Scan &amp; Connect</button>
  <button id="btn-disconnect" onclick="bleDisconnect()" disabled>Disconnect</button>
  <button id="btn-send" class="primary" onclick="bleSend()">Send</button>
  <span id="status" class="status">Not connected</span>
</div>

<div class="id-row">
  <label>Ring ID:</label>
  <input type="text" id="ring-id" placeholder="e.g. my-ring">
  <button onclick="bleSetId()">Set ID</button>
  <span id="ring-id-display" style="font-size:13px; color:var(--text-dim)"></span>
</div>

<!-- ── Main Layout ─────────────────────────────────────────────────────────── -->
<div class="main">

  <!-- Sidebar: command list -->
  <div class="sidebar">
    <h2>Effects</h2>
    <div id="cmd-list"></div>
  </div>

  <!-- Right: controls + JSON -->
  <div class="content">

    <!-- Controls area -->
    <div class="controls" id="controls">
      <div id="cmd-desc" class="cmd-desc"></div>

      <!-- Global Parameters -->
      <div class="section">
        <div class="section-title">Global Parameters</div>

        <!-- Color -->
        <div class="form-row">
          <label>Color</label>
          <div class="color-group">
            <div class="color-swatch" id="color-swatch" onclick="document.getElementById('color-picker').click()"></div>
            <input type="color" id="color-picker" value="#ffffff">
            <span>R</span><input type="number" id="color-r" min="0" max="255" value="255">
            <span>G</span><input type="number" id="color-g" min="0" max="255" value="255">
            <span>B</span><input type="number" id="color-b" min="0" max="255" value="255">
          </div>
        </div>

        <!-- Color 2 -->
        <div class="form-row">
          <label>Color 2</label>
          <div class="color-group">
            <div class="color-swatch" id="color2-swatch" onclick="document.getElementById('color2-picker').click()"></div>
            <input type="color" id="color2-picker" value="#000000">
            <span>R</span><input type="number" id="color2-r" min="0" max="255" value="0">
            <span>G</span><input type="number" id="color2-g" min="0" max="255" value="0">
            <span>B</span><input type="number" id="color2-b" min="0" max="255" value="0">
          </div>
        </div>
        <div id="color2-hint" class="color2-hint"></div>

        <!-- Speed -->
        <div class="form-row">
          <label>Cycle duration (ms)</label>
          <input type="number" id="param-duration" min="1" max="60000" value="1000">
        </div>

        <!-- Brightness -->
        <div class="form-row">
          <label>Brightness</label>
          <input type="range" id="param-brightness-range" min="0" max="255" value="255">
          <input type="number" id="param-brightness" min="0" max="255" value="255" style="width:60px">
        </div>

        <!-- Duration -->
        <div class="form-row">
          <label>Total timeout (ms)</label>
          <input type="number" id="param-timeout" min="0" max="600000" value="0">
          <span class="hint">0 = no limit</span>
        </div>

        <!-- Cycles -->
        <div class="form-row">
          <label>Cycles</label>
          <input type="number" id="param-cycles" min="0" max="10000" value="0">
          <span class="hint">0 = no limit</span>
        </div>

        <p class="hint">Cycle duration × cycles = total run time. A nonzero timeout can stop it earlier.</p>

        <!-- Easing -->
        <div class="form-row">
          <label>Easing</label>
          <select id="param-easing"></select>
        </div>

        <!-- Reverse -->
        <div class="form-row">
          <label>Reverse</label>
          <input type="checkbox" id="param-reverse">
        </div>
      </div>

      <!-- Command-Specific Parameters -->
      <div class="section">
        <div class="section-title">Command Parameters</div>
        <div id="cmd-params"></div>
      </div>
    </div>

    <!-- Resize handle -->
    <div class="resize-handle" id="resize-handle"></div>

    <!-- JSON preview -->
    <div class="json-panel" id="json-panel">
      <div class="json-header">
        <span>JSON Preview</span>
        <div class="spacer"></div>
        <button onclick="copyJson()">Copy</button>
      </div>
      <pre id="json-preview"></pre>
    </div>
  </div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────

const SERVICE_UUID   = 'c0de1234-beef-cafe-1234-000000000001';
const CHAR_ID_UUID   = 'c0de1234-beef-cafe-1234-000000000002';
const CHAR_CTRL_UUID = 'c0de1234-beef-cafe-1234-000000000003';
const CHUNK_SIZE     = 500;

const COMMANDS = [
  'off', 'solid', 'blink', 'breathe', 'rotate', 'chase', 'rainbow',
  'wipe', 'sparkle', 'comet', 'bounce', 'fire', 'gradient', 'strobe', 'pulse',
];

const COMMAND_DESCRIPTIONS = {
  off:      'Turn all LEDs off',
  solid:    'Static color on all LEDs',
  blink:    'Alternate on/off (or color/color2)',
  breathe:  'Sinusoidal brightness pulse (or color blend)',
  rotate:   'Beam(s) rotating around the ring',
  chase:    'Marquee / theater chase pattern',
  rainbow:  'Full HSV rainbow rotation',
  wipe:     'Progressive color fill pixel by pixel',
  sparkle:  'Random pixels ignite and decay',
  comet:    'Single head with exponential tail',
  bounce:   'KITT / Cylon scanner, bounces back and forth',
  fire:     'Heat-based fire simulation',
  gradient: 'Two-color gradient rotating around ring',
  strobe:   'Rapid flash bursts with dark pause',
  pulse:    'Expanding ring of light from origin pixel',
};

// Command-specific parameters: [label, jsonKey, type, default, {min, max, step, choices}]
const COMMAND_PARAMS = {
  off:      [],
  solid:    [],
  blink:    [
    ['Duty cycle', 'duty', 'float', 0.5, {min: 0, max: 1, step: 0.05}],
  ],
  breathe:  [
    ['Min brightness', 'min_bright', 'int', 0, {min: 0, max: 255}],
    ['Max brightness', 'max_bright', 'int', 255, {min: 0, max: 255}],
  ],
  rotate:   [
    ['Beam width', 'width', 'int', 3, {min: 1, max: 16}],
    ['Beam count', 'count', 'int', 1, {min: 1, max: 8}],
    ['Trail length', 'trail', 'int', 4, {min: 0, max: 16}],
    ['Trail direction', 'trail_dir', 'choice', 'back', {choices: ['back', 'front', 'both']}],
  ],
  chase:    [
    ['Spacing', 'spacing', 'int', 3, {min: 1, max: 16}],
    ['Width', 'width', 'int', 3, {min: 1, max: 16}],
  ],
  rainbow:  [
    ['Saturation', 'saturation', 'int', 255, {min: 0, max: 255}],
    ['Spread', 'spread', 'int', 1, {min: 1, max: 8}],
  ],
  wipe:     [],
  sparkle:  [
    ['Density', 'density', 'float', 0.3, {min: 0, max: 1, step: 0.05}],
    ['Fade speed', 'fade_speed', 'int', 20, {min: 1, max: 100}],
  ],
  comet:    [
    ['Tail length', 'tail_length', 'int', 6, {min: 1, max: 16}],
    ['Trail decay', 'trail_decay', 'float', 0.65, {min: 0.1, max: 0.99, step: 0.05}],
  ],
  bounce:   [
    ['Width', 'width', 'int', 3, {min: 1, max: 16}],
    ['Trail', 'trail', 'int', 4, {min: 0, max: 16}],
  ],
  fire:     [
    ['Cooling', 'cooling', 'int', 55, {min: 10, max: 200}],
    ['Sparking', 'sparking', 'int', 120, {min: 0, max: 255}],
  ],
  gradient: [],
  strobe:   [
    ['Flashes per burst', 'flashes', 'int', 3, {min: 1, max: 20}],
    ['Pause (ms)', 'pause', 'int', 200, {min: 10, max: 5000}],
  ],
  pulse:    [
    ['Origin pixel', 'origin', 'int', 0, {min: 0, max: 15}],
  ],
};

const COLOR2_COMMANDS = new Set(['blink', 'breathe', 'chase', 'wipe', 'gradient']);

const EASING_CURVES = [
  'linear',
  'quadraticIn', 'quadraticOut', 'quadraticInOut', 'quadraticCenter',
  'cubicIn', 'cubicOut', 'cubicInOut', 'cubicCenter',
  'quarticIn', 'quarticOut', 'quarticInOut',
  'quinticIn', 'quinticOut', 'quinticInOut',
  'sinusoidalIn', 'sinusoidalOut', 'sinusoidalInOut',
  'exponentialIn', 'exponentialOut', 'exponentialInOut',
  'circularIn', 'circularOut', 'circularInOut',
  'gamma',
];

// ── State ─────────────────────────────────────────────────────────────────────

let currentCmd = 'off';
let bleDevice = null;
let bleServer = null;
let ctrlChar = null;
let idChar = null;
let ringName = null;

// ── Init ──────────────────────────────────────────────────────────────────────

function init() {
  buildSidebar();
  buildEasingDropdown();
  selectCommand('off');
  setupColorSync();
  setupResizeHandle();
  attachInputListeners();
  updateJson();

  // Check Web Bluetooth support
  if (!navigator.bluetooth) {
    setStatus('Web Bluetooth not supported — use Chrome/Edge', 'error');
    document.getElementById('btn-scan').disabled = true;
  }
}

// ── Sidebar ───────────────────────────────────────────────────────────────────

function buildSidebar() {
  const list = document.getElementById('cmd-list');
  for (const cmd of COMMANDS) {
    const btn = document.createElement('button');
    btn.className = 'cmd-btn';
    btn.textContent = cmd;
    btn.dataset.cmd = cmd;
    btn.onclick = () => selectCommand(cmd);
    list.appendChild(btn);
  }
}

function selectCommand(cmd) {
  currentCmd = cmd;

  // Update sidebar highlight
  document.querySelectorAll('.cmd-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cmd === cmd);
  });

  // Update description
  document.getElementById('cmd-desc').textContent = COMMAND_DESCRIPTIONS[cmd] || '';

  // Update color2 hint
  const hint = document.getElementById('color2-hint');
  if (COLOR2_COMMANDS.has(cmd)) {
    hint.textContent = `✓ ${cmd} uses color2`;
    hint.style.color = 'var(--success)';
  } else {
    hint.textContent = 'color2 not used by this command';
    hint.style.color = '';
  }

  // Rebuild command-specific params
  buildCmdParams(cmd);
  updateJson();
}

// ── Command Parameters ────────────────────────────────────────────────────────

function buildCmdParams(cmd) {
  const container = document.getElementById('cmd-params');
  container.innerHTML = '';

  const params = COMMAND_PARAMS[cmd] || [];
  if (params.length === 0) {
    container.innerHTML = '<div style="color:var(--text-dim); font-size:13px">No command-specific parameters</div>';
    return;
  }

  for (const [label, key, type, defaultVal, opts] of params) {
    const row = document.createElement('div');
    row.className = 'form-row';

    const lbl = document.createElement('label');
    lbl.textContent = label;
    row.appendChild(lbl);

    if (type === 'int' || type === 'float') {
      const input = document.createElement('input');
      input.type = 'number';
      input.id = `cparam-${key}`;
      input.min = opts.min;
      input.max = opts.max;
      input.step = opts.step || (type === 'float' ? 0.05 : 1);
      input.value = defaultVal;
      input.addEventListener('input', updateJson);
      row.appendChild(input);
    } else if (type === 'choice') {
      const sel = document.createElement('select');
      sel.id = `cparam-${key}`;
      for (const c of opts.choices) {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        if (c === defaultVal) opt.selected = true;
        sel.appendChild(opt);
      }
      sel.addEventListener('change', updateJson);
      row.appendChild(sel);
    }

    container.appendChild(row);
  }
}

// ── Easing Dropdown ───────────────────────────────────────────────────────────

function buildEasingDropdown() {
  const sel = document.getElementById('param-easing');
  for (const e of EASING_CURVES) {
    const opt = document.createElement('option');
    opt.value = e;
    opt.textContent = e;
    sel.appendChild(opt);
  }
}

// ── Color Sync ────────────────────────────────────────────────────────────────

function setupColorSync() {
  // Color 1
  setupColorGroup('color', '#ffffff');
  // Color 2
  setupColorGroup('color2', '#000000');
}

function setupColorGroup(prefix, initial) {
  const swatch = document.getElementById(`${prefix}-swatch`);
  const picker = document.getElementById(`${prefix}-picker`);
  const rInput = document.getElementById(`${prefix}-r`);
  const gInput = document.getElementById(`${prefix}-g`);
  const bInput = document.getElementById(`${prefix}-b`);

  swatch.style.backgroundColor = initial;

  // Picker → RGB inputs + swatch
  picker.addEventListener('input', () => {
    const hex = picker.value;
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    rInput.value = r;
    gInput.value = g;
    bInput.value = b;
    swatch.style.backgroundColor = hex;
    updateJson();
  });

  // RGB inputs → swatch + picker
  const syncFromRgb = () => {
    const r = clamp(parseInt(rInput.value) || 0, 0, 255);
    const g = clamp(parseInt(gInput.value) || 0, 0, 255);
    const b = clamp(parseInt(bInput.value) || 0, 0, 255);
    const hex = `#${hex2(r)}${hex2(g)}${hex2(b)}`;
    swatch.style.backgroundColor = hex;
    picker.value = hex;
    updateJson();
  };

  rInput.addEventListener('input', syncFromRgb);
  gInput.addEventListener('input', syncFromRgb);
  bInput.addEventListener('input', syncFromRgb);
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function hex2(n) { return n.toString(16).padStart(2, '0'); }

// ── Attach Global Input Listeners ─────────────────────────────────────────────

function attachInputListeners() {
  const ids = [
    'param-duration', 'param-brightness', 'param-brightness-range',
    'param-timeout', 'param-cycles', 'param-easing', 'param-reverse',
  ];
  for (const id of ids) {
    const el = document.getElementById(id);
    if (!el) continue;
    const evt = el.type === 'checkbox' ? 'change' : 'input';
    el.addEventListener(evt, updateJson);
  }

  // Sync brightness slider ↔ number
  const range = document.getElementById('param-brightness-range');
  const num = document.getElementById('param-brightness');
  range.addEventListener('input', () => { num.value = range.value; });
  num.addEventListener('input', () => { range.value = num.value; });
}

// ── Resize Handle ─────────────────────────────────────────────────────────────

function setupResizeHandle() {
  const handle = document.getElementById('resize-handle');
  const controls = document.getElementById('controls');
  const jsonPanel = document.getElementById('json-panel');

  let startY, startControlsH, startJsonH;

  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    startY = e.clientY;
    startControlsH = controls.offsetHeight;
    startJsonH = jsonPanel.offsetHeight;

    const onMove = (e) => {
      const dy = e.clientY - startY;
      const newControlsH = Math.max(150, startControlsH + dy);
      const newJsonH = Math.max(80, startJsonH - dy);
      controls.style.flex = 'none';
      controls.style.height = newControlsH + 'px';
      jsonPanel.style.flex = 'none';
      jsonPanel.style.height = newJsonH + 'px';
    };

    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// ── JSON Assembly ─────────────────────────────────────────────────────────────

function getColorRgb(prefix) {
  return [
    clamp(parseInt(document.getElementById(`${prefix}-r`).value) || 0, 0, 255),
    clamp(parseInt(document.getElementById(`${prefix}-g`).value) || 0, 0, 255),
    clamp(parseInt(document.getElementById(`${prefix}-b`).value) || 0, 0, 255),
  ];
}

function buildPayload() {
  const cmd = currentCmd;

  // "off" → minimal payload
  if (cmd === 'off') return {cmd: 'off'};

  const payload = {cmd};

  // Color (omit if white + off)
  const color = getColorRgb('color');
  if (!(color[0] === 255 && color[1] === 255 && color[2] === 255)) {
    payload.color = color;
  }

  // Color2 (omit if black)
  const color2 = getColorRgb('color2');
  if (!(color2[0] === 0 && color2[1] === 0 && color2[2] === 0)) {
    payload.color2 = color2;
  }

  // Per-cycle duration (always explicit)
  const duration = parseInt(document.getElementById('param-duration').value);
  payload.duration = Number.isFinite(duration) ? Math.max(1, duration) : 1000;

  // Brightness (omit if default 255)
  const brightness = parseInt(document.getElementById('param-brightness').value);
  if (brightness !== 255) payload.brightness = brightness;

  // Total timeout (omit if 0)
  const timeout = parseInt(document.getElementById('param-timeout').value) || 0;
  if (timeout > 0) payload.timeout = timeout;

  // Cycles (omit if 0)
  const cycles = parseInt(document.getElementById('param-cycles').value) || 0;
  if (cycles > 0) payload.cycles = cycles;

  // Easing (omit if linear)
  const easing = document.getElementById('param-easing').value;
  if (easing && easing !== 'linear') payload.easing = easing;

  // Reverse (omit if false)
  if (document.getElementById('param-reverse').checked) payload.reverse = true;

  // Command-specific params (omit if default)
  const params = COMMAND_PARAMS[cmd] || [];
  for (const [, key, type, defaultVal] of params) {
    const el = document.getElementById(`cparam-${key}`);
    if (!el) continue;

    let val;
    if (type === 'int') val = parseInt(el.value);
    else if (type === 'float') val = parseFloat(el.value);
    else val = el.value;

    // Compare with tolerance for floats
    if (type === 'float') {
      if (Math.abs(val - defaultVal) > 0.001) payload[key] = val;
    } else {
      if (val !== defaultVal) payload[key] = val;
    }
  }

  return payload;
}

function updateJson() {
  const payload = buildPayload();
  document.getElementById('json-preview').textContent = JSON.stringify(payload, null, 2);
}

function copyJson() {
  const text = document.getElementById('json-preview').textContent;
  navigator.clipboard.writeText(text).then(() => {
    setStatus('Copied to clipboard', 'connected');
    setTimeout(() => {
      if (bleDevice && bleDevice.gatt.connected) {
        setStatus(`Connected: ${ringName || 'ring'}`, 'connected');
      } else {
        setStatus('Not connected', '');
      }
    }, 1500);
  });
}

// ── BLE ───────────────────────────────────────────────────────────────────────

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

async function bleConnect() {
  if (!navigator.bluetooth) {
    setStatus('Web Bluetooth not supported', 'error');
    return;
  }

  setStatus('Requesting device...', 'busy');
  document.getElementById('btn-scan').disabled = true;

  try {
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{services: [SERVICE_UUID]}],
    });

    bleDevice.addEventListener('gattserverdisconnected', () => {
      setStatus('Disconnected', '');
      bleServer = null;
      ctrlChar = null;
      idChar = null;
      ringName = null;
      document.getElementById('btn-disconnect').disabled = true;
      document.getElementById('ring-id-display').textContent = '';
    });

    setStatus('Connecting...', 'busy');
    bleServer = await bleDevice.gatt.connect();

    const service = await bleServer.getPrimaryService(SERVICE_UUID);
    ctrlChar = await service.getCharacteristic(CHAR_CTRL_UUID);
    idChar = await service.getCharacteristic(CHAR_ID_UUID);

    // Read ring ID
    const idRaw = await idChar.readValue();
    ringName = new TextDecoder().decode(idRaw);
    document.getElementById('ring-id-display').textContent = `Current: ${ringName}`;

    setStatus(`Connected: ${ringName}`, 'connected');
    document.getElementById('btn-disconnect').disabled = false;

  } catch (err) {
    if (err.name === 'NotFoundError') {
      setStatus('Cancelled', '');
    } else {
      setStatus(`Error: ${err.message}`, 'error');
    }
    bleServer = null;
    ctrlChar = null;
    idChar = null;
  } finally {
    document.getElementById('btn-scan').disabled = false;
  }
}

async function bleDisconnect() {
  if (bleDevice && bleDevice.gatt.connected) {
    bleDevice.gatt.disconnect();
  }
  setStatus('Disconnected', '');
  document.getElementById('btn-disconnect').disabled = true;
  document.getElementById('ring-id-display').textContent = '';
}

async function bleSend() {
  if (!ctrlChar) {
    // Auto-connect if not connected
    await bleConnect();
    if (!ctrlChar) return;
  }

  const payload = buildPayload();
  const jsonStr = JSON.stringify(payload);
  const data = new TextEncoder().encode(jsonStr);

  setStatus('Sending...', 'busy');
  document.getElementById('btn-send').disabled = true;

  try {
    // Chunk if needed
    for (let i = 0; i < data.length; i += CHUNK_SIZE) {
      const chunk = data.slice(i, i + CHUNK_SIZE);
      await ctrlChar.writeValueWithResponse(chunk);
    }
    setStatus(`Sent to ${ringName || 'ring'}`, 'connected');
  } catch (err) {
    setStatus(`Send error: ${err.message}`, 'error');
  } finally {
    document.getElementById('btn-send').disabled = false;
  }
}

async function bleSetId() {
  const newId = document.getElementById('ring-id').value.trim();
  if (!newId) return;

  if (!idChar) {
    await bleConnect();
    if (!idChar) return;
  }

  try {
    setStatus(`Setting ID to '${newId}'...`, 'busy');
    const data = new TextEncoder().encode(newId);
    await idChar.writeValueWithResponse(data);
    ringName = newId;
    document.getElementById('ring-id-display').textContent = `Current: ${ringName}`;
    document.getElementById('ring-id').value = '';
    setStatus(`ID set to '${newId}'`, 'connected');
  } catch (err) {
    setStatus(`Set ID error: ${err.message}`, 'error');
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────

init();
</script>
